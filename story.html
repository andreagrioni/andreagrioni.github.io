  <link rel="stylesheet" href="css/story.css">
  <script>
    // Old story URLs (story.html?file=docs/AG###_slug.md) now live at
    // docs/AG###_slug.html. Only redirect to files matching that pattern.
    (function () {
      var file = new URLSearchParams(window.location.search).get('file') || '';
      var m = file.match(/^docs\/(AG\d{3}_[A-Za-z0-9_-]+)\.md$/);
      if (m) window.location.replace('docs/' + m[1] + '.html' + window.location.hash);
    })();
  </script>
</head>
